<section class="page-hero">
  <div class="container">
    <h1>Page not found</h1>
    <p>The page you were looking for has moved or no longer exists.</p>
  </div>
</section>
<section class="section">
  <div class="container">

    <ul>
      {%- for item in site.nav -%}<li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>{%- endfor -%}
    </ul>
  </div>
</section>
