combustion_simulator:
  text: >-
    A combustion simulator developed by Dr. Sallam's collaborator, Dr. Shubham Srivastava
    (Rheem Water Heating), is used in the lab for studying mixtures of reacting flows.
    Contact Dr. Srivastava for access and copyright information.
  contact_label: Dr. Shubham Srivastava on LinkedIn
