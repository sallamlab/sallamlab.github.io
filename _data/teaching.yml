# Photo galleries and extras for the Teaching page.
# Photos live in assets/img/ — give just the file name.
# ----------------------------------------------------------------

# Interactive learning tools, shown near the top of the Teaching page.
# url: a page on this site (for example /teaching/heat-exchanger/) or a full https:// link.
# image: optional picture in assets/img/.
tools:
  - title: Heat exchanger simulator
    label: Interactive tool
    courses: MAE 3524 Thermal Fluids Design · MAE 3233 Heat Transfer
    url: /teaching/heat-exchanger/
    image: hx-simulator.svg
    button: Open the simulator
    text: >-
      Set the inlet temperatures and flow rates of a parallel-flow, counterflow, shell-and-tube
      or crossflow heat exchanger and watch the outlet temperatures, effectiveness and heat
      transfer rate update live on a color-coded schematic, with a short write-up of the
      equations behind it.
  - title: Moist air process simulator
    label: Interactive tool
    courses: MAE 3524 Thermal Fluids Design
    url: /teaching/psychrometrics/
    image: psychro-simulator.svg
    button: Open the simulator
    text: >-
      Heat, cool, dehumidify or humidify a stream of moist air and follow the process on an
      interactive psychrometric chart. Change the inlet air or the amount of heat and water to
      see the exit temperature and humidity, the heat transfer per kilogram of dry air, the water
      condensed or added, and the HVAC loads, with a short write-up of the equations behind it.
  - title: Cooling tower simulator
    label: Interactive tool
    courses: MAE 3524 Thermal Fluids Design
    url: /teaching/cooling-tower/
    image: cooling-tower-simulator.svg
    button: Open the simulator
    text: >-
      Send the condenser water of a water-cooled chiller through an evaporative cooling tower. Change
      the outdoor air, the hot water temperature or the chiller load, the water flow and the fan speed
      to see the cold water returned to the chiller, the air leaving the tower, the evaporation, drift,
      blowdown and makeup water, and the fan power, on an animated picture of the tower. Set the
      approach yourself or let a rated tower (ε-NTU model) predict it, with the fan holding a cold
      water setpoint, and read a short write-up of the equations behind it.
  - title: Pipe flow simulator
    label: Interactive tool
    courses: ENSC 3233 Fluid Mechanics · MAE 3524 Thermal Fluids Design
    url: /teaching/pipe-flow/
    image: pipe-flow-simulator.svg
    button: Open the simulator
    text: >-
      Read the Moody chart the way you would by hand. Choose the fluid, the pipe material, the
      diameter, the length and the flow rate, and watch the Reynolds number and the friction factor
      move on an interactive Moody chart. Solve the three classic pipe flow problems, finding the
      pressure drop (Type I), the flow rate (Type II) or the pipe diameter (Type III), with the
      trial-and-error path drawn on the chart, a step-by-step solution, a MATLAB check with
      Colebrook.m and a short write-up of the equations behind it.

