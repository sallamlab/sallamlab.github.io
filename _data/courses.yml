      url: https://youtu.be/UqtlttFRzAk
    - label: "Mechanical vapor compression desalination / wastewater treatment — Video 1"
      url: https://youtu.be/9lm2ubpOoL4
    - label: "Mechanical vapor compression desalination / wastewater treatment — Video 2"
