- code: ENSC 3233
  title: Fluid Mechanics
  level: undergraduate
  description: >-
    The study of fluid properties, statics, conservation equations, dimensional analysis and
    similitude, viscous flow in ducts, inviscid flow, boundary layer theory, open channel flow,
    turbomachinery and fluid measurement techniques.
  prerequisites: ENSC 2113 and MATH 2153 with a grade of "C" or better.

- code: MAE 3013
  title: Engineering Analysis and Methods
  level: undergraduate
  description: >-
    Setup and solution of equations which govern mechanical engineering systems. Application and
    solution of the governing equations to describe the steady state or transient behavior of
    dynamics, mechanics and circuit problems. Linear sets of equations and ODEs are used to
    describe systems; solutions may be simplified using complex numbers or Fourier/Laplace
    transforms. Numerical methods for solutions, data analysis, quality control and statistical
    hypothesis testing are covered.
  prerequisites: A grade of "C" or higher in PHYS 2114 and MATH 2233.

- code: MAE 3233
  title: Heat Transfer
  level: undergraduate
  description: >-
    Mechanisms of heat transfer. Steady and transient conduction, free and forced convection,
    heat exchanger design and analysis, radiation and multiphase behavior. Numerical methods,
    dimensional analysis and boundary layer theory.
  prerequisites: A grade of "C" or higher in ENSC 3233.

- code: MAE 3293
  title: Compressible Flow
  level: undergraduate
  description: >-
    Basic equations of compressible flow. Nozzle and duct flows with friction and heat transfer,
    choking, normal and oblique shock waves, Prandtl-Meyer expansions, compressible flow over
    airfoils.
  prerequisites: A grade of "C" or higher in ENSC 2213, ENSC 3233 and MATH 2233.
  resources:
