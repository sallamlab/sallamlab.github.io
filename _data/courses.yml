- code: MAE 4243
  title: Aerospace Propulsion and Power
  level: undergraduate
  description: >-
    The study of aerospace power and propulsion engines utilizing a gas as the working fluid.
    Design and analysis of complete aircraft engine systems and individual components of the
    aircraft engine. Engine component matching for design using analysis routines, including
    inlets and diffusers, fans and compressors, combustors, turbines, nozzles, and propellers.
    Additional propulsion and power systems including chemical and non-chemical rocket motors
    and other internal combustion engines.
  prerequisites: Grades of "C" or higher in ENSC 3233 and MAE 3293.

- code: MAE 4263
  title: Energy Conversion Systems
  level: undergraduate
  description: >-
    This course covers the use of renewable and non-renewable energy sources in power production.
    Energy conversion processes are analyzed, and performance characteristics of components and
    systems are modeled using modern computational methods. Applications include overall design
    of conventional Rankine power systems and may also include design of nuclear, solar, wind,
    wave, thermoelectric, and geothermal energy systems.
  prerequisites: Admission to MAE professional school. Grades of "C" or higher in MAE 3233 and MAE 3223 or MAE 3524.
  resources:
    - label: Wave Power
      url: https://youtu.be/UUlA5WKDiww
    - label: Pumped Storage Hydropower
      url: https://youtu.be/57OFwhXQdYY
    - label: Torque Converter
      url: https://youtu.be/bRcDvCj_JPs

- code: MAE 4273
  title: Experimental Fluid Dynamics
  level: undergraduate
  description: >-
    Experimental study of basic and applied fluid dynamics systems with comparisons to analytical
    predictions. Fluid dynamics instrumentation, digital data acquisition and processing, design
    of facilities and experiments, technical report writing and design project with experimental
    verification.
  prerequisites: A grade of "C" or higher in MAE 3113 and ENSC 3233.

- code: MAE 5243
  title: Micro Flows
  level: graduate
  description: >-
    Fundamentals and simulation of micro flows including governing equations, slip models,
    shear- and pressure-driven micro flows. Thermal effects in micro scales. Applications: MEMS
    and micro propulsion. Numerical methods for continuum simulation and atomistic simulation.
  prerequisites: Graduate standing or consent of instructor.

- code: MAE 5253
  title: Multiphase Flow
  level: graduate
  description: >-
    Theory, methods and practical experience for studying complex transient multiphase flows:
    basic concepts and definitions, dynamics of bubbles, drops and rigid particles, gas-liquid
    transport in ducts, fluid-solid transport in ducts, aerosol and spray systems, foam,
    fluidization, particle separation systems, multiphase flow in porous media, breakup of liquid
    sheets and jets, modeling, and advanced experimental techniques for multiphase flow.
  prerequisites: Graduate standing.

- code: MAE 5263
  title: Combustion
  level: graduate
  description: >-
    Chemical thermodynamics, chemical kinetics, conservation equations for reacting systems,
    premixed laminar flames, diffusion flames, turbulent flames, mechanism reduction and
    chemistry solvers, combustion diagnostics, and new combustion technologies.
