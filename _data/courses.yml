- code: MAE 3524
  title: Thermal Fluids Design
  level: undergraduate
  description: >-
    Design, modeling and simulation of thermal systems. Analysis and modeling of components such
    as fans, pumps, ducts, pipes, fittings, heat exchangers, and heat pumps.
  prerequisites: Admission to MAE professional school. Grades of "C" or higher in ENSC 2213 and ENSC 3233, or concurrent enrollment in MAE 3233.
  resources:
    - label: "Video 1: How to install MATLAB"
      url: https://youtu.be/h6tytgQH8rI
