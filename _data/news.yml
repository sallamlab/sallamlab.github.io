- date: 2023
  year: 2023
  title: Chris Scott wins the ASME Mid-Continent Graduate Technical Innovation Award
  text: >-
    Chris Scott received the 2023 Graduate Technical Innovation Award from the ASME Mid-Continent
    Section for presenting “Effect of Injector Intrusion on Aerated Liquid Injection in Supersonic
    Crossflow.” At the MAE Symposium, Andrew Williamson's poster was featured on the symposium
    webpage and Chris was awarded the best oral presentation award.
  photos:
    - file: img-8548.jpg
      caption: Chris Scott's ASME Mid-Continent Section award certificate
    - file: screen-shot-2023-04-08-at-4-28-24-pm.png
      caption: 2023 ASME Mid-Continent Section Technical Innovation Award
    - file: 1681528404688.jpg
      caption: Poster session at the MAE Symposium
    - file: 409213446-24436793262602914-9094458785663427812-n.jpg
      caption: Bipin and Dr. Sallam, Fall 2023

