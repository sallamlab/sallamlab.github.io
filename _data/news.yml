# News items, newest first.
# ----------------------------------------------------------------
# Each item:
#   date:   shown as written (e.g. "May 2026", "Nov. 19–20, 2024")
#   year:   four-digit year, used for grouping
#   title:  short headline
#   text:   one or two sentences (simple HTML links allowed, optional)
#   photos: optional list of { file, caption } — photos live in assets/img/
#   link:   optional { label, url } shown as a "Read more" button
# ----------------------------------------------------------------

- date: May 2026
  year: 2026
  title: Advisor of the Year and a third straight ASME section award
  text: >-
    Dr. Sallam was named Advisor of the Year at the OSU-Tulsa Student Organization Awards, and
    the OSU-Tulsa student section of ASME received the Student Section Achievement Award for the
    third consecutive year. 2026 also marks the 25th anniversary of the section, established in
    March 2001.
  photos:
    - file: 1776389679200.jpg
      caption: Advisor of the Year, OSU-Tulsa Student Organization Awards 2026
    - file: 1776794412900.jpg
      caption: ASME Student Section Achievement Award, 2026
    - file: screen-shot-2026-05-05-at-4-00-05-pm.png
      caption: "ASME wins again"

