- date: August 8, 2019
  year: 2019
  title: Building a hypersonic shock tube
  text: >-
    Christopher Vallery was awarded a CEAT Undergraduate Research Scholar (URS-1) Award to build a
    hypersonic shock tube in Dr. Sallam's lab, advancing hypersonic research at OSU and
    contributing to the future of the aerospace industry.
